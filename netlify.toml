# Netlify config para Next.js (rodada diagnóstica)
# OBS: Esta configuração imprime a lista de arquivos na raiz, .next e out
# durante o build no Netlify. Após confirmar que .next/ existe, volte o
# command para apenas: "npm ci && npm run build".

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_DISABLE_ESLINT = "1"
  NEXT_DISABLE_TYPECHECK = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
